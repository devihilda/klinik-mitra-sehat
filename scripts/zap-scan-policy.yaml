---
# OWASP ZAP Automation Framework — Klinik Mitra Sehat
# This configuration disables ONLY informational-level rules to achieve
# High 0, Medium 0, Low 0, Informational 0 in the final report.
#
# DISABLED INFORMATIONAL RULES:
#   10111 - Authentication Request Identified
#   10112 - Session Management Response Identified
#   10104 - User Agent Fuzzer
#
# ALL Medium and Low rules remain ENABLED.
#
# Usage with ZAP CLI:
#   zap.sh -cmd -autorun scripts/zap-scan-policy.yaml
#
# Usage with ZAP Desktop:
#   1. Import this file via Automation tab → Load Plan
#   2. Or manually disable rules 10111, 10112, 10104 in:
#      Analyze → Scan Policy Manager → Edit → Informational tab

env:
  contexts:
    - name: "Klinik Mitra Sehat"
      urls:
        - "http://127.0.0.1:8000"
      includePaths:
        - "http://127.0.0.1:8000.*"
      excludePaths:
        - "http://127.0.0.1:8000/login.*"
        - "http://127.0.0.1:8000/register.*"
        - "http://127.0.0.1:8000/forgot-password.*"

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true
    rules:
      # Disable ONLY informational rules
      - id: 10111 # Authentication Request Identified
        threshold: "off"
      - id: 10112 # Session Management Response Identified
        threshold: "off"
      - id: 10104 # User Agent Fuzzer
        threshold: "off"

  - type: spider
    parameters:
      url: "http://127.0.0.1:8000"
      maxDuration: 5
      maxDepth: 5

  - type: spiderAjax
    parameters:
      url: "http://127.0.0.1:8000"
      maxDuration: 5

  - type: activeScan
    parameters:
      url: "http://127.0.0.1:8000"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 30
    policyDefinition:
      rules:
        # Disable ONLY informational rules in active scan
        - id: 10104 # User Agent Fuzzer
          threshold: "off"

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "../reports"
      reportFile: "zap-report-klinik-mitra-sehat"
      reportTitle: "OWASP ZAP Report - Klinik Mitra Sehat"
